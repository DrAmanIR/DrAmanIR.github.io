<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: a PACS reading-room shell. Fixed series list on the left, study viewport on the right,
   DICOM-style mono overlays for tags and counts. */
:root{
  --bg:#eef1f4;
  --surface:#ffffff;
  --ink:#16202b;
  --muted:#5b6876;
  --line:#d5dbe2;
  --accent:#0b5cad;
  --accent-soft:#e3eefa;
  --amber:#a8620a;
  --amber-soft:#fbf0dd;
  --ok:#1f7a4d;
  --display:"Archivo",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218;--surface:#151c24;--ink:#e3e9ef;--muted:#93a1b0;--line:#26313d;
    --accent:#6fb2ff;--accent-soft:#16283c;--amber:#f0b04f;--amber-soft:#2c2214;--ok:#5fd19a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218;--surface:#151c24;--ink:#e3e9ef;--muted:#93a1b0;--line:#26313d;
  --accent:#6fb2ff;--accent-soft:#16283c;--amber:#f0b04f;--amber-soft:#2c2214;--ok:#5fd19a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}

.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
nav a:hover{background:var(--bg)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav a .ct{font:500 11px var(--mono);color:var(--muted)}
nav a[aria-current="page"] .ct{color:var(--accent)}
.navlabel{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 10px;margin-top:6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}

main{min-width:0;padding:28px clamp(16px,4vw,48px) 80px;max-width:1100px}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;font:inherit;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--mono);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.page-head{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.eyebrow{font:500 12px var(--mono);color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
.page-head h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.page-head p{margin:0;color:var(--muted);max-width:65ch}
.progress{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--muted)}
.bar{flex:0 0 160px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

.toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.toc a{font-size:13px;padding:5px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.toc a:hover{border-color:var(--accent);color:var(--accent)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.group>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.group>header h2{font-size:18px;font-weight:700;letter-spacing:-.005em}
.group>header .ct{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.group-note{padding:12px 18px 0;margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.sub{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:14px 18px 4px}
ul.items{list-style:none;margin:0;padding:4px 0 8px}
.item{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 18px;align-items:start}
.item:hover{background:var(--bg)}
.item input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
.item .t{font-weight:500}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .by{color:var(--muted);font-size:14px}
.item .note{color:var(--muted);font-size:14px;margin-top:2px}
.tag{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.must{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.tag.paid{background:transparent;border-style:dashed}
.tag.guideline{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.find{font:500 11px var(--mono);color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
.find:hover{color:var(--accent);border-color:var(--accent)}
.empty{padding:14px 18px;color:var(--muted);font-size:14px;font-style:italic}

.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h3{font-size:16px;margin-bottom:8px}
.panel p{margin:0 0 8px;color:var(--muted);font-size:15px}
.panel ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.step:hover{border-color:var(--accent)}
.step .n{font:500 11px var(--mono);color:var(--amber)}
.step b{font-family:var(--display);font-size:17px}
.step span{font-size:14px;color:var(--muted)}
.callout{border-left:3px solid var(--amber);background:var(--amber-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:18px;font-size:15px}
.results-head{font:500 12px var(--mono);color:var(--muted);margin-bottom:12px}
mark{background:var(--amber-soft);color:inherit;padding:0 1px;border-radius:2px}

.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  .mobile-nav{display:flex;position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;gap:4px;padding:10px 16px;scrollbar-width:none}
  .mobile-nav a{flex:none;font-size:14px;font-weight:500;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink);background:var(--bg)}
  .mobile-nav a[aria-current="page"]{background:var(--accent);color:var(--surface)}
  .hero,.path{grid-template-columns:1fr}
  main{padding-top:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const TAGS={book:"Book",article:"Article",guideline:"Guideline",video:"Video",quiz:"Quiz",app:"App",telegram:"Telegram",plan:"Topic",paid:"Paid",must:"Must-read"};
const FILTERS=["all","must","book","article","guideline","video","quiz"];

/* ---------- STATE ---------- */
let done={};try{done=JSON.parse(localStorage.getItem("rr-done")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("rr-done",JSON.stringify(done))}catch(e){}};
let filter="all",query="";

/* index items with stable ids */
S.forEach(s=>s.groups.forEach((g,gi)=>{g.items=g.items.map((it,ii)=>typeof it==="string"?it:{t:it[0],a:it[1],u:it[2],tags:it[3]||[],n:it[4]||"",id:s.id+"-"+gi+"-"+ii,sec:s,grp:g})}));
const real=s=>s.groups.flatMap(g=>g.items.filter(i=>typeof i!=="string"));

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=t=>{t=esc(t);if(!query)return t;const q=query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp("("+q+")","ig"),"<mark>$1</mark>")};
const match=i=>(filter==="all"||i.tags.includes(filter))&&(!query||(i.t+" "+i.a+" "+i.n).toLowerCase().includes(query.toLowerCase()));

function itemHTML(i,showSec){
  const title=i.u?`<a href="${esc(i.u)}" target="_blank" rel="noopener">${hl(i.t)}</a>`:hl(i.t);
  const tags=i.tags.map(t=>`<span class="tag ${t}">${TAGS[t]||t}</span>`).join("");
  const find=!i.u&&i.tags.includes("book")?`<a class="find" href="https://www.google.com/search?tbm=bks&q=${encodeURIComponent(i.t+" "+i.a)}" target="_blank" rel="noopener">find</a>`:"";
  const where=showSec?`<span class="by">· ${esc(i.sec.name)} › ${esc(i.grp.h)}</span>`:"";
  return `<li class="item${done[i.id]?" done":""}"><input type="checkbox" id="c-${i.id}" data-id="${i.id}" ${done[i.id]?"checked":""} aria-label="Mark ${esc(i.t)} as done">
  <div><div class="t">${title}</div><div class="meta">${i.a?`<span class="by">${hl(i.a)}</span>`:""}${tags}${find}${where}</div>${i.n?`<div class="note">${hl(i.n)}</div>`:""}</div></li>`;
}
function groupHTML(g,gi){
  const vis=[];let pendingSub=null;
  g.items.forEach(i=>{if(typeof i==="string"){pendingSub=i.slice(1);return}if(match(i)){if(pendingSub){vis.push(`<div class="sub">${esc(pendingSub)}</div>`);pendingSub=null}vis.push(itemHTML(i))}});
  const n=g.items.filter(i=>typeof i!=="string").length;
  if((filter!=="all"||query)&&!vis.length)return "";
  const body=n===0?`<div class="empty">Nothing here yet. To be added.</div>`:vis.length?`<ul class="items">${vis.join("")}</ul>`:"";
  return `<section class="group" id="g-${gi}"><header><h2>${esc(g.h)}</h2><span class="ct">${n} ITEM${n===1?"":"S"}</span></header>${g.note?`<p class="group-note">${esc(g.note)}</p>`:""}${body}</section>`;
}
function progressHTML(items){
  const d=items.filter(i=>done[i.id]).length,p=items.length?Math.round(d/items.length*100):0;
  return `<div class="progress"><span class="bar"><i style="width:${p}%"></i></span>${d}/${items.length} DONE</div>`;
}
function homeExtras(){
  return `<div class="hero">
   <div class="panel"><h3>About</h3><p>A curated study platform for residents, exam aspirants and practising radiologists. It covers anatomy, physics, ultrasound, radiographs, CT, MRI and subspecialties, linking the books, videos, quizzes and articles that matter.</p><p><b>Vision:</b> make radiology learning structured and exam-oriented.</p></div>
   <div class="panel"><h3>Who this is for</h3><ul><li>Residents building competence in each modality</li><li>Residents preparing for MD/DNB, NEET SS and INI SS</li><li>Practising radiologists wanting a quick reference</li></ul></div>
  </div>
  <div class="path">
   <a class="step" href="#my-picks"><span class="n">01 · RESIDENCY YEARS 1–2</span><b>Build the core</b><span>Core Radiology, physics, anatomy, daily spotters</span></a>
   <a class="step" href="#exams"><span class="n">02 · FINAL YEAR</span><b>MD / DNB exam</b><span>Revise, then 5–10 years of PYQs</span></a>
   <a class="step" href="#exams"><span class="n">03 · SUPERSPECIALTY</span><b>NEET SS / INI SS (IR)</b><span>Crack the Core, classifications, IR hardware</span></a>
  </div>`;
}
function render(){
  const id=(location.hash||"#home").slice(1);
  const sec=S.find(s=>s.id===id)||S[0];
  document.querySelectorAll("nav a, .mobile-nav a").forEach(a=>{if(a.dataset.id===sec.id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  updateCounts();
  const v=document.getElementById("view");
  if(query){
    const all=S.flatMap(real).filter(match);
    v.innerHTML=`<div class="results-head">${all.length} RESULT${all.length===1?"":"S"} FOR “${esc(query)}” ACROSS ALL SECTIONS</div>`+(all.length?`<section class="group"><ul class="items">${all.map(i=>itemHTML(i,true)).join("")}</ul></section>`:`<div class="panel">No matches. Try an author name, a modality or a topic like “Doppler”.</div>`);
    return;
  }
  const items=real(sec);
  const toc=sec.groups.length>3?`<div class="toc">${sec.groups.map((g,gi)=>`<a href="#${sec.id}" data-jump="g-${gi}">${esc(g.h)}</a>`).join("")}</div>`:"";
  v.innerHTML=`<div class="page-head"><span class="eyebrow">${esc(sec.eyebrow)}</span><h1>${esc(sec.title)}</h1><p>${esc(sec.intro)}</p>${items.length?progressHTML(items):""}</div>`+
   (sec.id==="home"?homeExtras():"")+
   (sec.id==="ai"?`<div class="callout">Never paste patient identifiers into a public AI tool. Treat every AI output as a draft you are responsible for.</div>`:"")+
   toc+sec.groups.map(groupHTML).join("");
}
function updateCounts(){
  document.querySelectorAll("nav a").forEach(a=>{const s=S.find(x=>x.id===a.dataset.id),it=real(s);a.querySelector(".ct").textContent=it.length?`${it.filter(i=>done[i.id]).length}/${it.length}`:""});
}
function buildNav(){
  ["start","mod","exam"].forEach(k=>{document.getElementById("nav-"+k).innerHTML=S.filter(s=>s.nav===k).map(s=>`<a href="#${s.id}" data-id="${s.id}"><span>${esc(s.name)}</span><span class="ct"></span></a>`).join("")});
  document.getElementById("mnav").innerHTML=S.map(s=>`<a href="#${s.id}" data-id="${s.id}">${esc(s.name)}</a>`).join("");
  document.getElementById("filters").innerHTML=FILTERS.map(f=>`<button class="chip" data-f="${f}" aria-pressed="${f===filter}">${f==="all"?"ALL":TAGS[f].toUpperCase()}</button>`).join("");
}
document.addEventListener("change",e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;if(e.target.checked)done[id]=1;else delete done[id];save();e.target.closest(".item").classList.toggle("done",e.target.checked);const sec=(location.hash||"#home").slice(1);const ph=document.querySelector(".page-head .progress");const s=S.find(x=>x.id===sec)||S[0];if(ph&&!query)ph.outerHTML=progressHTML(real(s));updateCounts()});
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){filter=c.dataset.f;document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b===c));render();return}
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();document.getElementById(j.dataset.jump).scrollIntoView({behavior:"smooth",block:"start"})}
  const n=e.target.closest("nav a,.mobile-nav a,.step,.brand");if(n&&query){query="";document.getElementById("q").value=""}
});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();render()});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
buildNav();render();
</script>
