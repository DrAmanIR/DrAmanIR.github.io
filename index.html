## About Radiology Resources:
Welcome to Radiology Resources, a dedicated platform created to support learning, mastery, and excellence in the field of radiology. This site is thoughtfully curated for radiology residents, exam aspirants, and practicing radiologists who seek high-yield, practical radiology study materials in one accessible place.
Radiology Resources brings together essential educational content across core imaging disciplines from anatomy and physics to ultrasound, X-rays, CT, MRI, and subspecialties, linking to trusted tools, books, video sources, quizzes, and structured study guides that help build both foundational knowledge and advanced diagnostic skills.
### Our Vision
1. We aim to demystify radiology and make learning structured, efficient, and exam-oriented.
2. Radiology is a vast and constantly evolving field. With the right resources and guided preparation strategies, mastering it becomes not just achievable but rewarding.
### Who This Is For:
1. Radiology residents building competence across modalities
2. Radiology residents targeting MD/DNB,  NEET SS, INI SS Examination.
3. Practicing radiologists seeking quick reference and curated resources.

/* ---------- renderer ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline=s=>esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
function toHTML(md){
  const cards=[];let cur=null,html="",depth=0;
  const closeLists=()=>{while(depth>0){html+="</li></ul>";depth--}};
  const flush=()=>{closeLists();if(cur)cards.push({h:cur,body:html});html=""};
  md.trim().split("\n").forEach(line=>{
    if(line.startsWith("## ")){flush();cur=line.slice(3);return}
    if(line.startsWith("### ")){closeLists();html+=`<h3>${inline(line.slice(4))}</h3>`;return}
    const m=line.match(/^( *)- (.*)$/);
    if(m){
      const lvl=m[1].length/2+1;
      if(lvl>depth){while(depth<lvl){html+="<ul><li>";depth++}}
      else{while(depth>lvl){html+="</li></ul>";depth--}html+="</li><li>"}
      html+=inline(m[2]);return;
    }
    closeLists();if(line.trim())html+=`<p>${inline(line)}</p>`;
  });
  flush();return cards;
}
PAGES.forEach(p=>p.cards=toHTML(p.md));

  const id=(location.hash||"#radiology").slice(1);
  const p=PAGES.find(x=>x.id===id)||PAGES[0];
  document.querySelectorAll("nav a,.mobile-nav a").forEach(a=>{if(a.dataset.id===p.id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.title="Radiology Resourses - "+p.name;
  const toc=p.cards.length>3?`<div class="toc">${p.cards.map((c,i)=>`<a href="#${p.id}" data-jump="c-${i}">${esc(c.h)}</a>`).join("")}</div>`:"";
  document.getElementById("view").innerHTML=`<h1>${esc(p.name)}</h1>${toc}`+p.cards.map((c,i)=>`<section class="card" id="c-${i}"><h2>${esc(c.h)}</h2><div class="card-body">${c.body}</div></section>`).join("");
  applySearch();
}
function applySearch(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll("#view mark").forEach(m=>m.replaceWith(...m.childNodes));
  document.querySelectorAll("#view .card").forEach(card=>{
    if(!q){card.classList.remove("hide");card.querySelectorAll(".hide").forEach(e=>e.classList.remove("hide"));return}
    const lis=[...card.querySelectorAll("li,p")];
    let any=card.querySelector("h2").textContent.toLowerCase().includes(q);
    lis.forEach(li=>{const hit=li.textContent.toLowerCase().includes(q);li.classList.toggle("hide",!hit&&!any&&!li.querySelector("li"));if(hit)any=true});
    card.classList.toggle("hide",!any);
  });
}
document.getElementById("nav").innerHTML=PAGES.map(p=>`<a href="#${p.id}" data-id="${p.id}">${p.name}</a>`).join("");
document.getElementById("mnav").innerHTML=PAGES.map(p=>`<a href="#${p.id}" data-id="${p.id}">${p.name}</a>`).join("");
document.addEventListener("click",e=>{const j=e.target.closest("[data-jump]");if(j){e.preventDefault();document.getElementById(j.dataset.jump).scrollIntoView({behavior:"smooth"})}});
document.getElementById("q").addEventListener("input",applySearch);
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
